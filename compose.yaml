# Local PostgreSQL and Blob Storage emulator, started by the "local" profile through
# Spring Boot's Docker Compose support. The image tags match the tests' Testcontainers.

# Fixed, so the volumes keep their names whatever the folder is called.
name: civicgrant

services:

  postgres:
    image: postgres:18
    # Local-only credentials, not secrets.
    environment:
      POSTGRES_DB: civicgrant
      POSTGRES_USER: civicgrant_app
      POSTGRES_PASSWORD: civicgrant_password
    ports:
      - "127.0.0.1:5432:5432"
    # From PostgreSQL 18 on, the image wants the volume here, not at /var/lib/postgresql/data.
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicgrant_app -d civicgrant"]
      interval: 5s
      timeout: 3s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.38.0
    # The Azure SDK speaks a newer Blob API version than this Azurite release knows.
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--location", "/data", "--skipApiVersionCheck"]
    ports:
      - "127.0.0.1:10000:10000"
    volumes:
      - azurite_data:/data

volumes:
  postgres_data:
  azurite_data:
