# ============================================================
# CI: VERIFY THE CODE, THEN BUILD AND PUBLISH THE IMAGE
# ============================================================
#
# Pull request to develop or main:  Verify, then build the image without pushing it.
# Push to develop or main:          Verify, then build the image and push it to
#                                   Azure Container Registry as civicgrant:<commit SHA>.

name: CI  # Name shown in the Actions tab of the repository.


# ------------------------------------------------------------
# TRIGGERS
# ------------------------------------------------------------

on:
  push:
    branches: [ develop, main ]  # A commit lands on develop or main.
  pull_request:
    branches: [ develop, main ]  # A pull request targets develop or main.


# ------------------------------------------------------------
# DEFAULTS FOR EVERY JOB
# ------------------------------------------------------------

# Rights of the GITHUB_TOKEN that every job receives: read the repository, nothing else.
# A job that needs more declares its own permissions (see Publish image).
permissions:
  contents: read

# Runs for the same workflow and branch (or pull request) share a group.
# - Pull requests: a new commit cancels the run still going for the previous one.
# - Pushes: never cancelled, so every commit on develop and main gets its image.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Maven reads MAVEN_ARGS on every call:
# --batch-mode:           no interactive prompts.
# --no-transfer-progress: no download progress bars filling the log.
env:
  MAVEN_ARGS: --batch-mode --no-transfer-progress


# Jobs run in parallel, each on its own fresh virtual machine, unless "needs" orders them.
# Nothing is shared between jobs unless it's passed on explicitly.
jobs:

  # ============================================================
  # JOB 1: VERIFY
  # Lint the contract, check formatting, run the tests, analyse with SonarQube.
  # ============================================================

  verify:
    name: Verify
    runs-on: ubuntu-latest  # Linux virtual machine hosted by GitHub.
    timeout-minutes: 20     # Stop the job if it hangs.

    # Every action is pinned to a full commit SHA, with its version as a comment.
    # A tag can be moved to point at other code, a SHA can't. Renovate updates both.
    steps:

      # 1. Download the repository onto the runner.
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch the full Git history, not only the last commit.
          # SonarQube needs it to tell new code from old code.
          fetch-depth: 0

      # 2. Install Java 25 and cache the Maven repository between runs.
      #    The cache key is a hash of the pom files: dependencies are downloaded
      #    again only when a pom changes.
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin  # Eclipse Temurin, the same JDK as the Docker image.
          java-version: '25'
          cache: maven

      # 3. Lint the OpenAPI contract with Redocly, run as a Docker image.
      #    redocly.yaml at the repository root says which file to lint and with which rules.
      #    The image tag must match the lint command in CLAUDE.md.
      - name: Lint API contract
        uses: docker://redocly/cli:2.71.2
        with:
          args: lint

      # 4. Check formatting. Fails on unformatted code; it doesn't change any file.
      #    Locally, ./mvnw spotless:apply fixes the formatting.
      - name: Check formatting
        run: ./mvnw spotless:check

      # 5. Compile, run the unit and integration tests, and package every module.
      #    Testcontainers starts PostgreSQL on the Docker engine already on the runner.
      #    The JAR built here stays on this runner: Publish image builds its own.
      - name: Compile and test
        run: ./mvnw verify

      # 6. Analyse the code with SonarQube.
      #    Pull requests from forks get no secrets, so there's no token: they skip this step.
      #    Pushes and pull requests from this repository are analysed.
      - name: Analyse with SonarQube
        if: github.event_name == 'push' || !github.event.pull_request.head.repo.fork
        run: ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}  # The only secret in this workflow.


  # ============================================================
  # JOB 2: PUBLISH IMAGE
  # Build the Docker image. On pushes, also push it to Azure Container Registry.
  # ============================================================

  publish:
    name: Publish image
    needs: verify           # Starts only after Verify has succeeded.
    runs-on: ubuntu-latest  # A new runner: it gets no files from Verify.
    timeout-minutes: 20

    # Job-level permissions replace the workflow-level ones.
    permissions:
      contents: read   # Repeated, because the workflow-level value no longer applies.
      id-token: write  # Lets this job, and only this one, request GitHub's OIDC token for the Azure login.

    steps:

      # 1. Download the repository: the Dockerfile and the source it compiles.
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 2. Set up Docker Buildx, which runs builds with BuildKit.
      #    BuildKit is needed for the GitHub Actions build cache used in step 5.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # 3. Log in to Azure as id-civicgrant-pipeline, without any password.
      #    GitHub's OIDC token is exchanged for an Azure token. Azure accepts it only for
      #    pushes to develop and main: the federated credentials in
      #    infra/modules/pipeline-identity.bicep. Pull requests skip this step.
      #    The three ids are repository variables, not secrets: they say who logs in
      #    and where, but don't let anyone log in.
      - name: Log in to Azure
        if: github.event_name == 'push'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}              # Which identity: id-civicgrant-pipeline.
          tenant-id: ${{ vars.AZURE_TENANT_ID }}              # Which Entra tenant it lives in.
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}  # Which subscription az commands act on.

      # 4. Log Docker in to the registry and work out the image name. Pushes only.
      - name: Log in to the registry
        id: registry  # Lets step 5 read this step's output as steps.registry.outputs.image.
        if: github.event_name == 'push'
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}  # The registry's resource name, a repository variable.
        run: |
          # Turn the Azure login into Docker credentials for the registry.
          # It reads the registry resource first, which is why the identity has
          # Reader on the registry besides Container Registry Repository Writer.
          az acr login --name "$ACR_NAME"

          # The registry's host name, for example crcivicgrantqzlkjfco4difw.azurecr.io.
          login_server=$(az acr show --name "$ACR_NAME" --query loginServer --output tsv)

          # Tag the image with the commit SHA, never latest: every image leads back
          # to exactly one commit. Writing to $GITHUB_OUTPUT makes the value
          # available to later steps.
          echo "image=$login_server/civicgrant:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      # 5. Build the image from the Dockerfile and, on pushes, push it.
      #    On pull requests this only proves the image builds; the result is thrown away.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .  # Files the Docker build can see: the whole repository.
          push: ${{ github.event_name == 'push' }}

          # The name from step 4. Empty on pull requests, because step 4 was skipped:
          # an untagged image that isn't pushed is fine.
          tags: ${{ steps.registry.outputs.image }}

          # Standard OCI labels: the registry shows which repository and commit
          # the image was built from.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

          # Reuse layers from earlier runs, stored in the GitHub Actions cache.
          # mode=max also stores the build stage's layers, not only the final image's.
          cache-from: type=gha
          cache-to: type=gha,mode=max
