# Pull requests and pushes to develop or main are verified and build the image.
# Pushes also push it to the registry as civicgrant:<sha>, and develop deploys it to tst.
name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

permissions:
  contents: read

# A new commit cancels a pull request's previous run; pushes are never cancelled,
# so every commit on develop and main gets its image.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MAVEN_ARGS: --batch-mode --no-transfer-progress

# Runs scripts with pipefail; GitHub's default bash -e ignores failures inside a pipeline.
defaults:
  run:
    shell: bash

jobs:

  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SonarQube needs the history to tell new code from old.
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Lint API contract
        uses: docker://redocly/cli:2.72.1
        with:
          args: lint

      - name: Check formatting
        run: ./mvnw spotless:check

      - name: Compile and test
        run: ./mvnw verify

      # Pull requests from forks get no secrets, so they have no token to analyse with.
      - name: Analyse with SonarQube
        if: github.event_name == 'push' || !github.event.pull_request.head.repo.fork
        run: ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  publish:
    name: Publish image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Azure trusts pushes to develop and main only: infra/modules/shared/pipeline-identity.bicep.
      - name: Log in to Azure
        if: github.event_name == 'push'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to the registry
        id: registry
        if: github.event_name == 'push'
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: |
          # Reads the registry resource first, hence the identity's Reader role next to Repository Writer.
          az acr login --name "$ACR_NAME"
          login_server=$(az acr show --name "$ACR_NAME" --query loginServer --output tsv)
          echo "image=$login_server/civicgrant:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      # On pull requests there's no tag and no push: this only proves the image builds.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.registry.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-tst:
    name: Deploy to test
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    # The first deployment creates the Container Apps environment, which takes a while.
    timeout-minutes: 30
    # The deploy identity trusts only tokens for this GitHub Environment, and its
    # variables replace the repository's, AZURE_CLIENT_ID included.
    environment:
      name: tst
      url: ${{ steps.deploy.outputs.appUrl }}
    concurrency:
      group: deploy-tst
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    # infra/environment.tst.bicepparam reads these with readEnvironmentVariable().
    env:
      RESOURCE_GROUP: rg-civicgrant-tst
      STACK_NAME: stack-civicgrant-tst
      IMAGE_TAG: ${{ github.sha }}
      REGISTRY_LOGIN_SERVER: ${{ vars.REGISTRY_LOGIN_SERVER }}
      POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
      DOCUMENTS_ENDPOINT: ${{ vars.DOCUMENTS_ENDPOINT }}
      ALERT_ACTION_GROUP_ID: ${{ vars.ALERT_ACTION_GROUP_ID }}
      APP_IDENTITY_ID: ${{ vars.APP_IDENTITY_ID }}
      APP_IDENTITY_CLIENT_ID: ${{ vars.APP_IDENTITY_CLIENT_ID }}
      APP_IDENTITY_PRINCIPAL_ID: ${{ vars.APP_IDENTITY_PRINCIPAL_ID }}
      API_CLIENT_ID: ${{ vars.API_CLIENT_ID }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Pinned, so a newer Bicep on the runner never changes a deployment by surprise.
      - name: Install Bicep
        run: az bicep install --version v0.48.1

      # Same flags as Deploy, or the preview describes another deployment.
      - name: Preview changes
        run: |
          stack_id="/subscriptions/$(az account show --query id --output tsv)/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.Resources/deploymentStacks/$STACK_NAME"

          az stack-whatif group create \
            --name "whatif-$GITHUB_RUN_ID" \
            --resource-group "$RESOURCE_GROUP" \
            --stack-id "$stack_id" \
            --parameters infra/environment.tst.bicepparam \
            --action-on-unmanage deleteAll \
            --deny-settings-mode denyDelete \
            --retention-interval PT1H \
            --no-color | tee whatif.txt

          {
            echo '### Changes to tst'
            echo '```text'
            cat whatif.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # deleteAll removes whatever the templates no longer declare; denyDelete stops
      # anyone, Owners included, from deleting the stack's resources outside it.
      - name: Deploy
        id: deploy
        run: |
          az stack group create \
            --name "$STACK_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --parameters infra/environment.tst.bicepparam \
            --action-on-unmanage deleteAll \
            --deny-settings-mode denyDelete \
            --description "civicgrant tst, commit $GITHUB_SHA" \
            --yes \
            --output none

          for output in appName appUrl; do
            value=$(az stack group show \
              --name "$STACK_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --query "outputs.$output.value" \
              --output tsv)
            echo "$output=$value" >> "$GITHUB_OUTPUT"
          done

      # Health includes the database check, so UP also proves the Entra sign-in to
      # PostgreSQL. The retries cover a cold start from zero replicas.
      - name: Check health
        env:
          APP_URL: ${{ steps.deploy.outputs.appUrl }}
        run: |
          curl --fail --silent --show-error \
            --retry 30 --retry-delay 10 --retry-all-errors --max-time 30 \
            "$APP_URL/actuator/health" | tee health.json
          echo
          jq --exit-status '.status == "UP"' health.json

      # A revision that never gets ready leaves the previous one serving, and the
      # health check would then pass against the old image.
      - name: Check revision
        env:
          APP_NAME: ${{ steps.deploy.outputs.appName }}
        run: |
          for attempt in $(seq 1 30); do
            ready=$(az resource show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$APP_NAME" \
              --resource-type Microsoft.App/containerApps \
              --query "properties.latestReadyRevisionName == properties.latestRevisionName" \
              --output tsv)
            if [[ "$ready" == "true" ]]; then
              echo "The latest revision is ready and serving."
              exit 0
            fi
            echo "Attempt $attempt: the latest revision isn't ready yet."
            sleep 10
          done
          echo "::error::The latest revision never became ready. Check its system logs."
          exit 1
