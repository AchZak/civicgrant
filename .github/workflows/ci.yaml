# ============================================================
# WORKFLOW CONFIGURATION
# ============================================================

name: CI  # Name displayed in the GitHub Actions interface.

# Run this workflow when:
on:
  push:
    branches: [ develop, main ]  # A commit is pushed to either branch.
  pull_request:
    branches: [ develop, main ]  # A PR targets either branch.

permissions:
  contents: read  # Grant read access to repository contents by default.

concurrency:
  # Give runs for the same workflow/ref a shared concurrency group.
  group: ${{ github.workflow }}-${{ github.ref }}

  # Cancel an older run when a newer run for the same PR ref starts.
  # Push runs are not cancelled by this setting.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Shared Maven options:
  # --batch-mode: suitable for automated CI execution.
  # --no-transfer-progress: reduce dependency download output.
  MAVEN_ARGS: --batch-mode --no-transfer-progress


# ============================================================
# JOB 1: VERIFY THE CODE
# ============================================================

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest  # GitHub creates a Linux runner for this job.
    timeout-minutes: 20

    steps:
      # 1. Download the repository onto the runner.
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch the full Git history, rather than only the latest commit.
          # This can be useful for tools such as SonarQube.
          fetch-depth: 0

      # 2. Install Java and configure Maven dependency caching.
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # 3. Check the API specification/contract for issues.
      # This runs Redocly CLI in a Docker container.
      - name: Lint API contract
        uses: docker://redocly/cli:2.71.2
        with:
          args: lint

      # 4. Check code formatting.
      # This checks formatting; it does not normally rewrite files.
      - name: Check formatting
        run: ./mvnw spotless:check

      # 5. Run Maven's verify lifecycle.
      # Typically includes compilation, tests, packaging, and verification.
      # A JAR is usually produced here if this is a JAR-packaged project.
      # IMPORTANT: this JAR is not automatically passed to the publish job.
      - name: Compile and test
        run: ./mvnw verify

      # 6. Run SonarQube analysis when the condition permits it.
      # Pushes run this step; PRs from forks skip it.
      - name: Analyse with SonarQube
        if: github.event_name == 'push' || !github.event.pull_request.head.repo.fork
        run: ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
        env:
          # Secret stored in GitHub Actions settings.
          # It authenticates the scanner to SonarQube.
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


  # ============================================================
  # JOB 2: BUILD AND PUBLISH THE DOCKER IMAGE
  # ============================================================

  publish:
    name: Publish image

    # Do not start this job unless verify succeeds.
    # This establishes job ordering, NOT file/artifact transfer.
    needs: verify

    # This is a separate runner from the verify job.
    # It does not automatically have the JAR produced by verify.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

      # Allow GitHub Actions to request an OIDC identity token.
      # Azure login can use this for federated authentication,
      # provided the Azure identity is configured for it.
      id-token: write

    steps:
      # 1. Check out the repository AGAIN on this new runner.
      # This gives Docker access to the source code and Dockerfile.
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 2. Set up Docker Buildx, which the next build step uses.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # 3. Authenticate an Azure identity.
      # Only runs on push events, not pull requests.
      # This does not, by itself, log Docker into the registry.
      - name: Log in to Azure
        if: github.event_name == 'push'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          # GitHub Actions variables identify the Azure identity
          # and subscription. They are configured separately in GitHub.
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # 4. Authenticate Docker to ACR and determine the image tag.
      # Only runs on push events.
      - name: Authenticate Docker to Azure Container Registry
        id: registry

        # The next step references this step's output as:
        # ${{ steps.registry.outputs.image }}
        if: github.event_name == 'push'

        run: |
          # Use the existing Azure login to authenticate Docker to ACR.
          # ACR_NAME is the registry's Azure resource name.
          az acr login --name "$ACR_NAME"
          
          # Ask Azure for the registry's login server hostname.
          # Example result: myregistry.azurecr.io
          # $(...) captures the command's output into a Bash variable.
          login_server=$(az acr show \
            --name "$ACR_NAME" \
            --query loginServer \
            --output tsv)
          
          # Construct the full Docker image tag:
          # <registry-host>/civicgrant:<Git-commit-SHA>
          #
          # GITHUB_SHA is supplied automatically by GitHub Actions.
          # GITHUB_OUTPUT is a special file used to expose step outputs.
          echo "image=$login_server/civicgrant:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

        env:
          # Read the ACR resource name from GitHub Actions variables
          # and expose it to this step's shell as $ACR_NAME.
          ACR_NAME: ${{ vars.ACR_NAME }}

      # 5. Build the Docker image and, on pushes, push it to ACR.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # Use the repository root as the Docker build context.
          # By default, the action looks for ./Dockerfile.
          # The Dockerfile determines how the application is packaged.
          context: .

          # On a push: build AND push the image.
          # On a PR: build the image, but do NOT push it.
          push: ${{ github.event_name == 'push' }}

          # Use the image tag created by the registry step above.
          # On a push this is something like:
          # myregistry.azurecr.io/civicgrant:<commit-SHA>
          #
          # On a PR, the registry step was skipped, so its output
          # is unavailable. The build still runs, but no push occurs.
          tags: ${{ steps.registry.outputs.image }}

          # Add metadata to identify the source repository and commit.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

          # Reuse previous Docker build cache when available.
          cache-from: type=gha

          # Save the build cache for subsequent workflow runs.
          cache-to: type=gha,mode=max