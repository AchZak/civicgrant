# Rulesets can't say which branch a pull request comes from, so the main ruleset
# requires this check instead: only develop, from this repository, may go into main.
name: PR source

on:
  pull_request:
    branches: [ main ]
    # "edited" catches a pull request retargeted to main after it was opened.
    types: [ opened, synchronize, reopened, edited ]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runs scripts with pipefail; GitHub's default bash -e ignores failures inside a pipeline.
defaults:
  run:
    shell: bash

jobs:

  source-branch:
    # Required by the main ruleset under this name.
    name: Source branch
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # A fork can have a develop branch too, hence the repository check.
      - name: Check source branch
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ] || [ "$HEAD_BRANCH" != "develop" ]; then
            echo "::error::Only develop may be merged into main. This pull request comes from $HEAD_REPO:$HEAD_BRANCH."
            exit 1
          fi
          echo "Source is $HEAD_REPO:$HEAD_BRANCH."
