spring:
  application:
    name: civicgrant

  docker:
    compose:
      enabled: false

  flyway:
    schemas: civicgrant
    default-schema: civicgrant
    create-schemas: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: civicgrant
